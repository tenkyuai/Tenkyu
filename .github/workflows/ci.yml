name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -rfE tests --junitxml=report.xml
      - name: Show failing tests on the run page
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("report.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  msg = (bad.get("message") or "").replace("\n", " ")[:300]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tk
          POSTGRES_PASSWORD: tk
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENKYU_TEST_PG_DSN: postgresql://tk:tk@localhost:5432/postgres
      TENKYU_TEST_PG_REQUIRED: "1"  # fail, do not skip, if the service container is unreachable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "psycopg[binary]>=3.1"
      - run: python -m pytest -q -rfE tests/test_postgres_store.py tests/test_blind_store.py tests/test_stores.py
