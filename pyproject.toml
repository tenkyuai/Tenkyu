[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tenkyu"
version = "0.3.0"
description = "Stop free-tier and credit farming in AI apps: explainable signup scoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tenkyu contributors" }]
keywords = ["abuse", "fraud", "free-tier", "credits", "signup", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tenkyuai/tenkyu"
Source = "https://github.com/tenkyuai/tenkyu"
Issues = "https://github.com/tenkyuai/tenkyu/issues"

[project.scripts]
tenkyu = "tenkyu.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenkyu = ["data/*.csv", "data/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
